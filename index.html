<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <style>
        body {
            background-color: aqua;
        }

        .form {
            width:400px;
            margin: 50px auto;


            --input-focus: #2d8cf0;
            --font-color: #1e1b1b;
            --font-color-sub: #666;
            --bg-color: beige;
            --main-color: black;
            padding: 20px;
            background: rgb(81, 159, 184);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
            border-radius: 5px;
            border: 2px solid var(--main-color);
            box-shadow: 4px 4px var(--main-color);
        }

        .title {
            color: var(--font-color);
            font-weight: 900;
            font-size: 20px;
            height: 70px;
            margin-bottom: 25px;
        }

        .stureg {
            height: 0px;
        }

        h3 {
            margin: 0;
        }

        .title span {
            color: var(--font-color-sub);
            font-weight: 600;
            font-size: 17px;
        }

        .input {
            width: 250px;
            height: 40px;
            border-radius: 5px;
            border: 2px solid var(--main-color);
            background-color: var(--bg-color);
            box-shadow: 4px 4px var(--main-color);
            font-size: 15px;
            font-weight: 600;
            color: var(--font-color);
            padding: 5px 10px;
            outline: none;
        }

        .input::placeholder {
            color: var(--font-color-sub);
            opacity: 0.8;
        }



        .login-with {
            display: flex;
            gap: 20px;
        }

        .button-log {
            cursor: pointer;
            width: 40px;
            height: 40px;
            border-radius: 100%;
            border: 2px solid var(--main-color);
            background-color: var(--bg-color);
            box-shadow: 4px 4px var(--main-color);
            color: var(--font-color);
            font-size: 25px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .icon {
            width: 24px;
            height: 24px;
            fill: var(--main-color);
        }

        .button-log:active,
        .button-confirm:active {
            box-shadow: 0px 0px var(--main-color);
            transform: translate(3px, 3px);
        }

        .button-confirm {
            margin: 20px;
            width: 150px;
            height: 40px;
            border-radius: 5px;
            border: 2px solid var(--main-color);
            background-color: var(--bg-color);
            box-shadow: 4px 4px var(--main-color);
            font-size: 17px;
            font-weight: 600;
            color: var(--font-color);
            cursor: pointer;
        }
        a {
            text-decoration: none;
            color: var(--font-color);
        }
    </style>



    <form class="form">
        <div class="title">
            <h2 class="stureg"> Student Registration</h2><br><span>
                <h3>Fill the form</h3>
            </span>
        </div>

        <label>
            <input class="input" name="name" placeholder="Full Name" type="text" required>
        </label>

        <label>
            <input class="input" name="father_name" placeholder="Father Name" type="text" required>
        </label>

        <label>
            <input class="input" name="rollno" placeholder="Roll Number" type="number" required>
        </label>

        <label>
            <input class="input" name="school" placeholder="School Name" type="text" required>
        </label>

        <label>
            <input class="input" name="class" placeholder="Class" type="text" required>
        </label>

        <label>
            <input class="input" name="age" placeholder="Age" type="number" min="3" max="30" required>
        </label>

        <label>
            <input class="input" name="email" placeholder="Gmail" type="email" required>
        </label>

        <label>
            <input class="input" name="contact" placeholder="Contact Number" type="tel" pattern="[0-9]{11}" required>
        </label>

        <button class="button-confirm" type="submit" ><a href="./formdata.html" >Submit →</a></button>
    </form>




    
    
    

    <script src="./sript.js"></script>
</body>

</html>
